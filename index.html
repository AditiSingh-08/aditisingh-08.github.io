/* Layout: bright pastel poster page. Centered tall uppercase headlines, a bottom dock for navigation,
   tilted paper cards, and an illustrated landscape for the hero, projects and contact.
   Color: off-white grid paper, near-black ink, seven pastels for blocks, five saturated dots for small marks.
   Type: Archivo on its narrow width axis at weight 900 for headlines, DM Sans for reading. */
:root {
  --bg: #EDF7F6;
  --grid: rgba(10, 90, 110, 0.06);
  --ink: #17171A;
  --muted: #54545B;
  --white: #FFFFFF;
  --line: rgba(23, 23, 26, 0.14);
  /* beach palette: aqua (pink), sunlit yellow, seafoam, sky blue, periwinkle (lav), sand (peach), palm green (lime) */
  --pink: #BDEEE7; --butter: #FFF0A6; --mint: #BDEFD2; --sky: #B8DAFF; --lav: #C9D6FF; --peach: #FBE3B0; --lime: #CDEEA4;
  --coral: #FF4D6D; --blue: #3B7BFF; --green: #1FBF6A; --orange: #FF9122; --purple: #7A5CFF;
  --display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 1px 0 rgba(23,23,26,.06), 0 14px 34px -14px rgba(23,23,26,.28);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; color: inherit; }
::selection { background: var(--ink); color: var(--white); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -64px; background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 999px; z-index: 100; }
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

.wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.disp { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 74; text-transform: uppercase; letter-spacing: -0.005em; line-height: .9; text-wrap: balance; }
.big { font-size: clamp(2.8rem, 9vw, 7.4rem); text-align: center; }

/* scroll settle */
.rv { transform: translateY(28px) rotate(var(--r, 0deg)); transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.rv.in { transform: translateY(0) rotate(var(--r, 0deg)); }
.tilt.in:hover { transform: translateY(-8px) rotate(0deg); transition-duration: .3s; }

/* pills, buttons, stickers */
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; box-shadow: var(--shadow); }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; font-weight: 700; font-size: .98rem; border: 1px solid var(--line); background: var(--white); cursor: pointer; box-shadow: var(--shadow); transition: transform .2s, background .2s, color .2s; }
.btn:hover { transform: translateY(-3px) rotate(-1deg); }
.btn.dark { background: var(--ink); color: var(--white); border-color: var(--ink); }
.btn.dark:hover { background: var(--blue); border-color: var(--blue); }
.sticker { position: absolute; display: inline-flex; align-items: center; gap: 8px; background: var(--white); padding: 7px 14px 7px 8px; border-radius: 12px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow); transform: rotate(var(--r, -4deg)); animation: bob 5s ease-in-out infinite; z-index: 3; white-space: nowrap; }

@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }

/* dock */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--white) 72%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); max-width: calc(100vw - 24px); }
.dock a { position: relative; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; color: var(--white); box-shadow: inset 0 -3px 0 rgba(0,0,0,.14); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.dock a:hover, .dock a:focus-visible { transform: translateY(-10px) scale(1.18); }
.dock a::after { content: attr(data-label); position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) scale(.9); background: var(--ink); color: var(--white); font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }

.cloud.b { animation-duration: 32s; animation-direction: alternate-reverse; }

.hero .name { font-size: clamp(4rem, 13vw, 12rem); line-height: .82; text-align: left; margin-top: clamp(4px, 1.5vw, 16px); text-wrap: wrap; letter-spacing: -0.01em; font-variation-settings: "wdth" 70; }
.hero .tagline { font-size: clamp(1.8rem, 4.6vw, 3.8rem); line-height: .95; text-align: left; max-width: 14ch; }

.hero-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding-top: 24px; }
.glass { background: color-mix(in srgb, var(--white) 86%, transparent); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.7); border-radius: 22px; padding: 22px; max-width: 520px; box-shadow: var(--shadow); }
.glass p { font-size: 1.05rem; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.teaser { display: flex; gap: 14px; align-items: center; background: color-mix(in srgb, var(--white) 80%, transparent); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.7); border-radius: 18px; padding: 10px 18px 10px 10px; box-shadow: var(--shadow); transform: rotate(2deg); transition: transform .25s; max-width: 100%; }
.teaser:hover { transform: rotate(0) translateY(-4px); }
.teaser .th { width: 66px; height: 50px; border-radius: 10px; overflow: hidden; flex: none; background: #17181C; }

.teaser b { font-family: var(--display); font-variation-settings: "wdth" 80; font-weight: 900; text-transform: uppercase; font-size: 1.25rem; line-height: 1; display: block; margin: 2px 0; }

@media (max-width: 760px) { .sticker.hide-s { display: none; } .hero .banner { min-height: 0; } }

/* sections */
.sec { position: relative; padding-block: clamp(56px, 8vw, 110px); overflow-x: clip; scroll-margin-top: 10px; }
.head { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; margin-bottom: clamp(28px, 4vw, 52px); }
.doodle { position: absolute; pointer-events: none; color: var(--ink); opacity: .85; }

.lede { max-width: 640px; margin-inline: auto; text-align: center; font-size: 1.18rem; }

/* note cards */
.notes { margin-top: clamp(40px, 5vw, 64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr)); gap: 22px; }

.note .n { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 74; text-transform: uppercase; font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: .95; letter-spacing: -.005em; }

.stage { padding: clamp(24px, 4vw, 56px) clamp(14px, 3vw, 44px) clamp(40px, 5vw, 72px); }

.chip:hover { background: var(--white); transform: translateY(-2px); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(22px, 3vw, 40px); align-items: start; }
.polaroid { position: relative; background: var(--white); border-radius: 20px; padding: 12px 12px 16px; box-shadow: var(--shadow); min-width: 0; }
.polaroid:nth-child(even) { margin-top: 26px; }
.polaroid .clip { position: absolute; top: -20px; left: 50%; width: 22px; height: 54px; margin-left: -11px; border: 3px solid var(--clip, var(--coral)); border-radius: 12px; transform: rotate(var(--cr, 8deg)); z-index: 2; background: transparent; }
.polaroid .clip::after { content: ""; position: absolute; left: 3px; top: 12px; width: 10px; height: 40px; border: 3px solid var(--clip, var(--coral)); border-radius: 8px; }
.chrome { display: flex; gap: 6px; padding: 4px 6px 10px; }
.chrome i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.shot { border-radius: 12px; overflow: hidden; background: #17181C; }
.shot svg { display: block; width: 100%; height: auto; }
.shot-img { display: block; width: 100%; aspect-ratio: 300 / 190; object-fit: cover; object-position: top; }
.screens { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; align-items: start; }
.screens figure { margin: 0; background: var(--bg); border-radius: 16px; padding: 10px; min-width: 0; }
.screens img { display: block; width: 100%; height: auto; border-radius: 10px; }

.pc-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 8px 0; }

.pc-foot h3 a::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 20px; }

.go { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--white); display: grid; place-items: center; transition: transform .25s, background .25s; }
.polaroid:hover .go { background: var(--blue); transform: rotate(-45deg); }
.st { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin: 12px 8px 0; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }

.tag { display: inline-block; padding: 5px 13px; border-radius: 999px; background: color-mix(in srgb, var(--white) 70%, transparent); border: 1px solid var(--line); font-size: .87rem; font-weight: 500; transition: transform .2s, background .2s; cursor: default; }

.skl { display: grid; gap: 14px; max-width: 920px; margin-inline: auto; }
.sk { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 12px 28px; align-items: center; padding: 22px 28px; border-radius: 22px; box-shadow: var(--shadow); transition: transform .3s; }
.sk:hover { transform: translateY(-4px) rotate(-.5deg); }
.sk h3 { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 74; text-transform: uppercase; font-size: clamp(1.6rem, 3vw, 2.2rem); line-height: .95; }

/* timeline */
.tl { position: relative; max-width: 900px; margin-inline: auto; padding-left: 34px; display: grid; gap: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: var(--ink); opacity: .85; border-radius: 2px; }
.tl-i { position: relative; border-radius: 22px; padding: 26px 28px; box-shadow: var(--shadow); min-width: 0; }

.tl-i h3 { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 76; text-transform: uppercase; font-size: clamp(1.7rem, 3.4vw, 2.5rem); line-height: .95; margin: 14px 0 6px; }

.badge { display: inline-block; margin-left: 8px; background: var(--ink); color: var(--white); border-radius: 999px; padding: 4px 14px; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.callout { margin-top: 18px; background: var(--white); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); max-width: 62ch; }
.callout h4 { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 76; text-transform: uppercase; font-size: 1.5rem; line-height: 1; margin-bottom: 8px; }

.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 24px; max-width: 1000px; margin-inline: auto; }

.faq { max-width: 720px; margin-inline: auto; display: grid; gap: 10px; }
.q { border-radius: 20px; box-shadow: var(--shadow); transform: translateX(var(--x, 0)) rotate(var(--r, 0deg)); transition: transform .35s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.q.open { transform: none; }
.q:hover { transform: translateX(var(--x, 0)) rotate(0deg); }

.q button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 24px; background: transparent; border: 0; cursor: pointer; text-align: left; font-weight: 700; font-size: 1.08rem; }

/* contact */
.cta { min-height: min(640px, 110vw); }
.cta .in-b { padding: clamp(26px, 5vw, 64px); display: flex; flex-direction: column; min-height: inherit; gap: 20px; }
.cta h2 { font-size: clamp(3rem, 10.5vw, 9.4rem); color: var(--white); text-align: left; max-width: 11ch; text-wrap: pretty; margin-top: clamp(30px, 6vw, 70px); }
.cta .btns { margin-top: auto; padding-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.mail { background: color-mix(in srgb, var(--white) 88%, transparent); border-radius: 999px; padding: 12px 20px; font-weight: 600; word-break: break-all; }
.resume { margin-top: 26px; background: var(--white); border-radius: 22px; padding: 22px 26px; display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; box-shadow: var(--shadow); scroll-margin-top: 20px; }
.resume h3 { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 76; text-transform: uppercase; font-size: 1.9rem; line-height: 1; }
.resume p { color: var(--muted); margin-top: 6px; font-size: .96rem; }
.ftr { padding-block: 40px calc(120px + env(safe-area-inset-bottom, 0px)); }
.ftr .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: .92rem; }
.ftr b { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 76; text-transform: uppercase; font-size: 1.4rem; }
.ftr nav { display: flex; gap: 20px; flex-wrap: wrap; font-weight: 600; }
.ftr nav a { border-bottom: 2px solid transparent; transition: border-color .2s; }
.ftr nav a:hover { border-color: var(--ink); }

/* case study */
.cs { padding-block: clamp(20px, 3vw, 40px) 20px; }
.cs-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: clamp(20px, 3vw, 40px); }
.cs-hero { border-radius: 30px; padding: clamp(28px, 5vw, 64px) clamp(20px, 4vw, 56px); text-align: center; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.cs-hero h1 { font-size: clamp(3.4rem, 13vw, 11rem); margin-top: 18px; }
.cs-hero .kind { margin-top: 16px; font-size: 1.2rem; font-weight: 600; }
.meta { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.meta div { background: var(--white); border-radius: 18px; padding: 16px 20px; box-shadow: var(--shadow); min-width: 0; }
.meta dt { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin-top: 4px; font-weight: 600; overflow-wrap: anywhere; }
.meta a { border-bottom: 2px solid var(--ink); }
.blk { margin-top: 18px; background: var(--white); border-radius: 24px; padding: clamp(22px, 3vw, 36px); box-shadow: var(--shadow); min-width: 0; }
.blk h2 { display: inline-block; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 76; text-transform: uppercase; font-size: clamp(1.8rem, 3.6vw, 2.6rem); line-height: .95; padding: 6px 14px 4px; border-radius: 12px; margin-bottom: 18px; transform: rotate(-1.2deg); }
.blk p { font-size: 1.1rem; max-width: 68ch; }
.blk .list { display: grid; gap: 10px; max-width: 68ch; }
.blk .list li { position: relative; padding: 12px 16px 12px 44px; border-radius: 14px; background: var(--bg); }
.blk .list li::before { content: ""; position: absolute; left: 16px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--c, var(--blue)); }
.blk .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.flow { display: grid; gap: 22px; }
.lane { border-radius: 18px; padding: 18px 18px 20px; }
.lane h4 { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 34px; }
.step { position: relative; background: var(--white); border-radius: 14px; padding: 14px 16px 16px; box-shadow: var(--shadow); min-width: 0; }
.step strong { display: block; font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 80; text-transform: uppercase; font-size: 1.25rem; line-height: 1; margin-bottom: 6px; }
.step span { font-size: .9rem; color: var(--muted); display: block; line-height: 1.4; }
.step:not(:last-child)::after { content: ""; position: absolute; top: 50%; right: -35px; width: 34px; border-top: 2px solid var(--ink); }
.step:not(:last-child)::before { content: ""; position: absolute; top: calc(50% - 4px); right: -36px; width: 8px; height: 8px; border-top: 2px solid var(--ink); border-right: 2px solid var(--ink); transform: rotate(45deg); }
@media (max-width: 900px) {
  .steps { grid-auto-flow: row; gap: 30px; }
  .step:not(:last-child)::after { top: auto; right: auto; left: 26px; bottom: -31px; width: 0; height: 30px; border-top: 0; border-left: 2px solid var(--ink); }
  .step:not(:last-child)::before { top: auto; right: auto; left: 22px; bottom: -32px; transform: rotate(135deg); }
}
.flow-cap { margin-top: 14px; color: var(--muted); font-size: .92rem; }
.pn { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.pn a { border-radius: 22px; padding: 22px 26px; box-shadow: var(--shadow); transition: transform .25s; display: block; }
.pn a:hover { transform: translateY(-5px) rotate(-.8deg); }
.pn small { display: block; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.pn b { font-family: var(--display); font-weight: 900; font-variation-settings: "wdth" 76; text-transform: uppercase; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  .rv { transform: rotate(var(--r, 0deg)); }
}
</style>

          </article>
          <article ref=${c[0]} className=${'tl-i rv' + (c[1] ? ' in' : '')} style=${{ background: 'var(--sky)', '--dotc': 'var(--blue)', transitionDelay: '80ms' }}>
            <span className="date">Graduated June 2026</span>
            <h3>B.Tech, Computer Science & Engineering (AI & ML)</h3>

            return html`<div key=${f.q} className=${'q' + (isOpen ? ' open' : '')} style=${{ background: f.bg, '--x': x, '--r': r }}>

  function CaseStudy(props) {
    var p = props.project;

    return html`<article className="cs">
      <div className="wrap">
        <div className="cs-top">
          <a className="btn" href="#projects"><${BackArrow} /> All projects</a>
          <a className="btn" href="#">Aditi Singh</a>

        <header className="cs-hero" style=${{ background: p.tone }}>
          <span className="pill"><i style=${{ background: 'var(--orange)' }}></i>${p.status}</span>
          <h1 className="disp">${p.name}</h1>
          <p className="kind">${p.kind}</p>

        <dl className="meta">
          <div><dt>Status</dt><dd>${p.status}</dd></div>

        <${Block} title="Overview" tone="var(--butter)"><p>${p.overview}</p><//>
        ${p.shots ? html`<${Block} title="Screens" tone="var(--sky)"><div className="screens">${p.shots.map(function (x) { return html`<figure key=${x.cap}><img src=${x.src} alt=${x.alt} loading="lazy" decoding="async" /><figcaption>${x.cap}</figcaption></figure>`; })}</div><//>` : null}
        <${Block} title="Problem" tone="var(--pink)"><p>${p.problem}</p><//>
        <${Block} title=${p.slug === 'assetguard-ai' ? 'Features in progress' : 'Key features'} tone="var(--mint)">
          <ul className="list" style=${{ '--c': dotc }}>${p.features.map(function (x) { return html`<li key=${x}>${x}</li>`; })}</ul>
        <//>
        <${Block} title="Technologies" tone="var(--sky)"><${Tags} items=${p.tech} /><//>
        <${Block} title="My contributions" tone="var(--lav)">
          <ul className="list" style=${{ '--c': dotc }}>${p.contrib.map(function (x) { return html`<li key=${x}>${x}</li>`; })}</ul>
        <//>
        <${Block} title="Architecture" tone="var(--peach)">
          <div className="flow" role="img" aria-label=${p.name + ' workflow diagram'}>
            ${p.lanes.map(function (l, li) {
              return html`<div className="lane" key=${l.name} style=${{ background: ['var(--bg)', 'var(--bg)'][li % 2] }}>
                <h4>${l.name}</h4>
                <ol className="steps">${l.steps.map(function (s) { return html`<li className="step" key=${s.t}><strong>${s.t}</strong><span>${s.d}</span></li>`; })}</ol>
              </div>`;
            })}
          </div>
          <p className="flow-cap">${p.flowNote}</p>
        <//>
        ${p.limits ? html`<${Block} title="Limitations" tone="var(--pink)">
          <ul className="list" style=${{ '--c': dotc }}>${p.limits.map(function (x) { return html`<li key=${x}>${x}</li>`; })}</ul>
        <//>` : null}
        <nav className="pn" aria-label="More projects">
          <a href=${'#' + prev.slug} style=${{ background: prev.tone }}><small>Previous</small><b>${prev.name}</b></a>

  /* ---------- App ---------- */
  function readHash() { try { return decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { return ''; } }
  function App() {
    var st = useState(readHash()); var hash = st[0], setHash = st[1];
    useEffect(function () {
      function on() { setHash(readHash()); }
      window.addEventListener('hashchange', on);
      return function () { window.removeEventListener('hashchange', on); };
    }, []);
    var project = PROJECTS.filter(function (p) { return p.slug === hash; })[0];
    var key = project ? project.slug : 'home';
    useEffect(function () {
      document.title = project ? project.name + ' | Aditi Singh' : 'Aditi Singh Portfolio';
      if (project) { window.scrollTo({ top: 0, behavior: 'instant' }); return; }
      var el = hash ? document.getElementById(hash) : null;
      if (el) el.scrollIntoView({ behavior: 'instant' }); else window.scrollTo({ top: 0, behavior: 'instant' });
    }, [key]);
    return html`<div>
      <a className="skip" href="#main">Skip to content</a>
      <main id="main">
        ${project
          ? html`<${CaseStudy} project=${project} />`
          : html`<div><${Hero} /><${About} /><${Projects} /><${Skills} /><${Experience} /><${Beyond} /><${Faq} /><${Contact} /></div>`}
      </main>
      <${Footer} />
      <${Dock} />
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
